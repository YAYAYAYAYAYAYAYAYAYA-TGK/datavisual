<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта находок</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050505;--pn:#0d0d0d;--tx:#e8e8e8;--mu:#7a7a7a;--bd:#232323;--ac:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#bar{display:flex;gap:6px;padding:8px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center;position:relative}
button,select{background:#141414;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#555}button.on{background:#fff;color:#000;border-color:#fff}
input[type=search],#pnm,#side input[type=text]{background:#0a0a0a;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:inherit}
#stat{color:var(--mu);font-size:12px;margin-left:auto}
#main{flex:1;display:flex;min-height:0}
#cv{flex:1;min-width:0;touch-action:none;background:radial-gradient(#1c1c1c 1px,transparent 1px) 0 0/24px 24px,var(--bg)}
#side{width:300px;background:var(--pn);border-left:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#side input[type=text],#side select,#side textarea{width:100%;box-sizing:border-box}
#side textarea{flex:1;min-height:160px;background:#0a0a0a;color:#d6d6d6;border:1px solid var(--bd);border-radius:8px;padding:8px;font:12.5px ui-monospace,Menlo,Consolas,monospace;resize:none;white-space:pre}
.row{display:flex;gap:6px}.row>*{flex:1}
.sw{display:flex;gap:8px}.sw i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #000;box-shadow:0 0 0 1px #333}.sw i.s{box-shadow:0 0 0 2px #fff,0 0 8px currentColor}
.mu{color:var(--mu);font-size:12px}
#set{position:absolute;top:100%;right:8px;z-index:5;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px;width:230px;display:none;flex-direction:column;gap:10px}
#set.o{display:flex}#set label{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media(max-width:700px){#main{flex-direction:column}#side{width:auto;height:40%;border-left:0;border-top:1px solid var(--bd)}}
text{fill:#ddd;font-size:12px;pointer-events:none;user-select:none}
.el{paint-order:stroke;stroke:#000;stroke-width:4px;fill:#fff}
#tabs{display:flex;gap:3px;padding:6px 8px 0;background:#000;overflow-x:auto;align-items:flex-end;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#0a0a0a;border:1px solid var(--bd);border-bottom:0;border-radius:9px 9px 0 0;color:var(--mu);cursor:pointer;white-space:nowrap;max-width:200px;position:relative;top:1px}
.tab:hover{color:#ccc}.tab.a{background:var(--pn);color:#fff;border-color:#3a3a3a;box-shadow:0 -2px 10px rgba(255,255,255,.06)}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab b{font-weight:400;opacity:.55;padding:0 4px;border-radius:5px;line-height:1.2}.tab b:hover{background:#333;opacity:1}
.tab input{background:#000;color:#fff;border:1px solid #555;border-radius:4px;padding:1px 4px;font:inherit;width:120px}
#tn{border:0;background:transparent;font-size:16px;padding:4px 10px;border-radius:8px;margin-bottom:2px}#tn:hover{background:#1a1a1a}
</style></head><body>
<div id="tabs"></div>
<div id="bar">
<button id="add">+ Узел</button>
<button id="lnk">Связать</button><button id="selb">▭ Область</button>
<button id="un">↶</button><button id="re">↷</button>
<button id="fit">Вписать</button>
<input type="search" id="q" placeholder="Поиск…" size="10">
<button id="exp">JSON</button><button id="md">Markdown</button><button id="imp">Импорт</button>
<button id="cfg">⚙</button><button id="lang"></button>
<span id="stat"></span>
<div id="set">
<label>Молнии<input type="checkbox" id="fx"></label>
<label>Размах<input type="range" id="amp" min="0" max="3" step=".1"></label>
<label>Скорость<input type="range" id="spd" min=".2" max="4" step=".1"></label>
<label>Молний<input type="range" id="bolts" min="1" max="8" step="1"></label>
<label>Привязка к сетке<input type="checkbox" id="snap"></label>
<label>Подписи связей<input type="checkbox" id="lbl"></label>
<button id="clr">Очистить всё</button>
</div>
</div>
<div id="main"><svg id="cv"><g id="w"></g></svg><div id="side"></div></div>
<input type="file" id="file" accept=".json" hidden>
<script>
const COL=['#ffffff','#ff4d4d','#4dff88','#ffc04d','#4dd2ff','#b94dff'];
const TY={'':'','domain':'D','ip':'IP','port':':','vuln':'!','acc':'@','note':'✎'};
const D={title:['Карта находок','Findings Map'],add:['+ Узел','+ Node'],lnk:['Связать','Link'],selb:['▭ Область','▭ Area'],fit:['Вписать','Fit'],imp:['Импорт','Import'],q:['Поиск…','Search…'],
fx:['Молнии','Lightning'],amp:['Размах','Amplitude'],spd:['Скорость','Speed'],bolts:['Молний','Bolts'],snap:['Привязка к сетке','Snap to grid'],lbl:['Подписи связей','Link labels'],clr:['Очистить всё','Clear all'],sure:['Точно удалить?','Sure?'],
chk:['проверено','checked'],hint:['Двойной клик по полю — новый узел. Shift+протяжка по узлу — связь, по полю — выделение области (или кнопка ▭). Ctrl+клик — добавить к выделению, Ctrl+A — выбрать всё. Ctrl+Z / Ctrl+Y — отмена, Ctrl+D — дубль.','Double-click the canvas — new node. Shift+drag from a node — link, from the canvas — area selection (or the ▭ button). Ctrl+click — add to selection, Ctrl+A — select all. Ctrl+Z / Ctrl+Y — undo/redo, Ctrl+D — duplicate.'],
edge:['Связь','Link'],lph:['Название (появится пузырём на линии)','Name (shown as a bubble on the line)'],lhint:['Без названия связь остаётся обычной линией. Описание ниже видно только здесь.','Without a name the link stays a plain line. The description below is visible only here.'],dph:['Команда, запрос, код…','Command, request, code…'],
cp:['Копировать','Copy'],rv:['Развернуть','Reverse'],dl:['Удалить связь','Delete link'],nm:['Название','Name'],sm:['Малый','Small'],md:['Средний','Medium'],lg:['Большой','Large'],prio:['Важность','Importance'],chk2:['Проверено','Checked'],nph:['Заметки, команды, код...','Notes, commands, code...'],
ch:['+ Связанный','+ Linked'],du:['Дубль','Duplicate'],cpn:['Копия','Copy note'],dn:['Удалить узел','Delete node'],new:['Новый','New'],sel:['Выбрано','Selected'],sethint:['Настройки применяются ко всем сразу','Settings apply to all at once'],
ty:['Тип…','Type…'],sh:['Форма…','Shape…'],sz:['Размер…','Size…'],prioall:['Важность всем','Importance for all'],mok:['✓ Проверено','✓ Checked'],mno:['Снять ✓','Clear ✓'],ax:['Выровнять ↔','Align ↔'],ay:['Выровнять ↕','Align ↕'],chain:['Связать цепочкой','Chain link'],del:['Удалить','Delete'],
links:['Связи','Links'],mdt:['Карта находок','Findings map'],err:['Не удалось прочитать файл','Could not read file'],proj:['Проект','Project'],rn:['Двойной клик — переименовать','Double-click to rename'],cl:['Закрыть проект','Close project'],np:['Новый проект','New project']};
const TNL={ru:{'':'Без типа',domain:'Домен',ip:'IP',port:'Порт',vuln:'Уязвимость',acc:'Аккаунт',note:'Заметка'},en:{'':'No type',domain:'Domain',ip:'IP',port:'Port',vuln:'Vulnerability',acc:'Account',note:'Note'}};
const SHL={ru:{circle:'Круг',square:'Квадрат',round:'Скруглённый',diamond:'Ромб',hex:'Шестиугольник',tri:'Треугольник'},en:{circle:'Circle',square:'Square',round:'Rounded',diamond:'Diamond',hex:'Hexagon',tri:'Triangle'}};
let lang='ru';try{lang=localStorage.getItem('pentest-lang')||'ru'}catch(e){}
const T=k=>D[k][lang=='en'?1:0],TN={...TNL[lang]},SH={...SHL[lang]};
const KEY='pentest-graph-v2',DEF={fx:true,amp:1,spd:1,snap:false,lbl:true,bolts:5};

function SHP(s,x,y,r,a){const P=p=>`<polygon points="${p.map(q=>q.join(',')).join(' ')}" ${a}/>`;
 if(s=='square')return`<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" ${a}/>`;
 if(s=='round')return`<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="${r*.4}" ${a}/>`;
 if(s=='diamond')return P([[x,y-r*1.25],[x+r*1.25,y],[x,y+r*1.25],[x-r*1.25,y]]);
 if(s=='hex')return P([0,1,2,3,4,5].map(i=>[x+r*1.1*Math.cos(Math.PI/3*i),y+r*1.1*Math.sin(Math.PI/3*i)]));
 if(s=='tri')return P([[x,y-r*1.2],[x+r*1.1,y+r*.8],[x-r*1.1,y+r*.8]]);
 return`<circle cx="${x}" cy="${y}" r="${r}" ${a}/>`}
let M=new Set(),box=null,selMode=false,S={nodes:[],edges:[],v:{x:0,y:0,k:1},cfg:{...DEF}},sel=null,linkMode=false,linkFrom=null,drag=null,tmp=null,hist=[],redo=[],q='';
const PK='pentest-projects-v1',PD=id=>'pentest-proj-'+id;let P={list:[],cur:null};
try{P=JSON.parse(localStorage.getItem(PK))||P}catch(e){}
if(!P.list||!P.list.length){const id='p'+Math.random().toString(36).slice(2,8);P={list:[{id,name:T('proj')+' 1'}],cur:id};try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}}
else{try{S=JSON.parse(localStorage.getItem(PD(P.cur)))||S}catch(e){}}
S.cfg={...DEF,...S.cfg};S.v=S.v||{x:0,y:0,k:1};
const $=id=>document.getElementById(id),svg=$('cv'),w=$('w'),side=$('side');
const uid=()=>Math.random().toString(36).slice(2,9);
const save=()=>{try{localStorage.setItem(PD(P.cur),JSON.stringify(S));localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
const N=id=>S.nodes.find(n=>n.id==id);
const pt=e=>{const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left-S.v.x)/S.v.k,y:(e.clientY-r.top-S.v.y)/S.v.k}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>n.r||28;
function push(){hist.push(JSON.stringify({n:S.nodes,e:S.edges}));if(hist.length>80)hist.shift();redo=[]}
function restore(a,b){if(!a.length)return;b.push(JSON.stringify({n:S.nodes,e:S.edges}));const s=JSON.parse(a.pop());S.nodes=s.n;S.edges=s.e;sel=null;M=new Set();save();render();panel()}
function match(n){return !q||(n.t+' '+n.note+' '+(TN[n.ty||'']||'')).toLowerCase().includes(q)}

function render(){
 w.setAttribute('transform',`translate(${S.v.x},${S.v.y}) scale(${S.v.k})`);
 let h='';
 for(const e of S.edges){const a=N(e.a),b=N(e.b);if(!a||!b)continue;
  const on=sel&&sel.t=='e'&&sel.id==e.id,sw=on?1.6:1;
  for(let k=0;k<(S.cfg.fx?S.cfg.bolts:1);k++)h+=`<g data-ed="${e.id}" data-k="${k}" fill="none" stroke="#fff" stroke-linecap="round" pointer-events="none">
  <path class="p" stroke-opacity=".12" stroke-width="${6*sw}"/>
  <path class="p c" stroke-width="${1.3*sw}"/><path class="p sp" stroke-width="${2.6*sw}" stroke-dasharray="14 150"/></g>`;
  h+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="16" data-e="${e.id}" style="cursor:pointer"/>`;
  if(S.cfg.lbl&&e.l){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,t=e.l+(e.d?'  </>':''),wd=Math.max(34,t.length*7+22),x0=mx-wd/2;
   h+=`<g data-e="${e.id}" style="cursor:pointer"><rect x="${x0}" y="${my-13}" width="${wd}" height="26" rx="13" fill="#0b0b0b" stroke="#fff" stroke-opacity="${on?1:.7}" stroke-width="${on?2:1.2}"/>
   <text x="${mx}" y="${my+4}" text-anchor="middle" style="fill:#fff;font-size:12px">${esc(e.l)}${e.d?'<tspan style="fill:#8a8a8a">  &lt;/&gt;</tspan>':''}</text></g>`}}
 if(tmp){const a=N(tmp.from);h+=`<line x1="${a.x}" y1="${a.y}" x2="${tmp.x}" y2="${tmp.y}" stroke="#fff" stroke-dasharray="5 4" stroke-width="2"/>`}
 for(const n of S.nodes){
  const on=M.has(n.id),lf=linkFrom==n.id,r=R(n),c=n.c||'#fff',b=(n.i||50)/100,sh=n.s||'circle';
  h+=`<g data-n="${n.id}" style="cursor:grab" opacity="${match(n)?1:.15}">
  ${b>.6?SHP(sh,n.x,n.y,r+18,`fill="${c}" fill-opacity="${((b-.6)*.3).toFixed(3)}"`):''}
  ${SHP(sh,n.x,n.y,r+8,`fill="${c}" fill-opacity="${(.03+.3*b).toFixed(3)}"`)}
  ${SHP(sh,n.x,n.y,r,`fill="#090909" stroke="${c}" stroke-opacity="${(.4+.6*b).toFixed(2)}" stroke-width="${on?3.5:2}" ${lf?'stroke-dasharray="4 3"':''}`)}
  ${SHP(sh,n.x,n.y,r,`fill="${c}" fill-opacity="${(.3*b).toFixed(3)}"`)}
  ${on?SHP(sh,n.x,n.y,r+5,'fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3 3"'):''}
  <text x="${n.x}" y="${n.y+4}" text-anchor="middle" style="font-weight:700;fill:${c}">${TY[n.ty||'']||''}</text>
  ${n.ok?`<circle cx="${n.x-r*.7}" cy="${n.y-r*.7}" r="8" fill="#4dff88"/><text x="${n.x-r*.7}" y="${n.y-r*.7+4}" text-anchor="middle" style="fill:#000;font-weight:700">✓</text>`:''}
  ${n.note?`<circle cx="${n.x+r*.7}" cy="${n.y-r*.7}" r="4.5" fill="#fff"/>`:''}
  <text x="${n.x}" y="${n.y+r*(sh=='diamond'?1.3:1.1)+16}" text-anchor="middle">${esc(n.t)}</text></g>`}
 if(box)h+=`<rect x="${Math.min(box.x0,box.x1)}" y="${Math.min(box.y0,box.y1)}" width="${Math.abs(box.x1-box.x0)}" height="${Math.abs(box.y1-box.y0)}" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
 w.innerHTML=h;paint(0);
 const ok=S.nodes.filter(n=>n.ok).length;$('stat').textContent=S.nodes.length?`${T('chk')} ${ok}/${S.nodes.length}`:'';
}
function bolt(a,b,t,seed,m=1){
 const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,px=-dy/L,py=dx/L,n=Math.max(5,Math.min(14,L/40|0)),
  A=S.cfg.fx?S.cfg.amp*m*Math.min(16,3+L*.06):0,P=[];
 for(let i=0;i<=n;i++){const s=i/n,env=Math.sin(Math.PI*s),o=env*A*(Math.sin(t*3+i*1.7+seed)+.5*Math.sin(t*5.7+i*2.9+seed*2));
  P.push([a.x+dx*s+px*o,a.y+dy*s+py*o])}
 let d=`M${P[0][0]},${P[0][1]}`;
 for(let i=0;i<n;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n,i+2)];
  d+=`C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
 return d}
function paint(ms){
 const t=ms/1000*S.cfg.spd;
 w.querySelectorAll('[data-ed]').forEach(g=>{
  const e=S.edges.find(x=>x.id==g.dataset.ed);if(!e)return;const a=N(e.a),b=N(e.b);if(!a||!b)return;
  const k=+g.dataset.k,seed=parseInt(e.id.slice(0,3),36)%97+k*23.7,d=bolt(a,b,t+k*.31,seed,.6+(k%3)*.4);
  g.querySelectorAll('.p').forEach(p=>p.setAttribute('d',d));
  const c=g.querySelector('.c');c.setAttribute('stroke-opacity',S.cfg.fx?.8+.2*Math.sin(t*9+seed):1);
  const sp=g.querySelector('.sp');sp.setAttribute('stroke-dashoffset',-(t*70+seed*9));sp.style.display=S.cfg.fx?'':'none'})}
(function loop(ms){if(S.cfg.fx&&!document.hidden)paint(ms);requestAnimationFrame(loop)})(0);

function panel(){
 if(sel&&sel.t=='m')return mpanel();
 if(!sel){side.innerHTML='<div class="mu">'+T('hint')+'</div>';return}
 if(sel.t=='e'){const e=S.edges.find(x=>x.id==sel.id);
  side.innerHTML=`<div>${T('edge')}</div><input type="text" id="l" placeholder="${T('lph')}" value="${esc(e.l)}">
  <div class="mu">${T('lhint')}</div>
  <textarea id="d" placeholder="${T('dph')}" spellcheck="false">${esc(e.d)}</textarea>
  <div class="row"><button id="cp">${T('cp')}</button><button id="rv">${T('rv')}</button></div><button id="del">${T('dl')}</button>`;
  $('l').onfocus=$('d').onfocus=push;$('l').oninput=x=>{e.l=x.target.value;save();render()};
  $('d').oninput=x=>{e.d=x.target.value;save();render()};
  $('d').onkeydown=x=>{if(x.key=='Tab'){x.preventDefault();x.target.setRangeText('  ',x.target.selectionStart,x.target.selectionEnd,'end');x.target.dispatchEvent(new Event('input'))}};
  $('cp').onclick=()=>{try{navigator.clipboard.writeText(e.d||'')}catch(x){}};
  $('rv').onclick=()=>{push();[e.a,e.b]=[e.b,e.a];save()};$('del').onclick=del;return}
 const n=N(sel.id);
 side.innerHTML=`<input type="text" id="t" placeholder="${T('nm')}" value="${esc(n.t)}">
 <div class="row"><select id="ty">${Object.keys(TN).map(k=>`<option value="${k}" ${k==(n.ty||'')?'selected':''}>${TN[k]}</option>`).join('')}</select>
 <select id="sz"><option value="20" ${R(n)==20?'selected':''}>${T('sm')}</option><option value="28" ${R(n)==28?'selected':''}>${T('md')}</option><option value="40" ${R(n)==40?'selected':''}>${T('lg')}</option></select></div>
 <div class="sw">${COL.map(c=>`<i data-c="${c}" class="${c==(n.c||'#ffffff')?'s':''}" style="background:${c};color:${c}"></i>`).join('')}</div>
 <select id="sh">${Object.keys(SH).map(k=>`<option value="${k}" ${k==(n.s||'circle')?'selected':''}>${SH[k]}</option>`).join('')}</select>
 <label class="mu">${T('prio')}: <b id="iv">${n.i||50}</b><input type="range" id="im" min="1" max="100" value="${n.i||50}" style="width:100%"></label>
 <label class="mu"><input type="checkbox" id="ok" ${n.ok?'checked':''}> ${T('chk2')}</label>
 <textarea id="nt" placeholder="${T('nph')}" spellcheck="false">${esc(n.note)}</textarea>
 <div class="row"><button id="ch">${T('ch')}</button><button id="du">${T('du')}</button><button id="cp">${T('cpn')}</button></div>
 <button id="del">${T('dn')}</button>`;
 $('t').onfocus=$('nt').onfocus=push;
 $('t').oninput=e=>{n.t=e.target.value;save();render()};
 $('nt').oninput=e=>{n.note=e.target.value;save();render()};
 $('nt').onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();e.target.setRangeText('  ',e.target.selectionStart,e.target.selectionEnd,'end');e.target.dispatchEvent(new Event('input'))}};
 $('ty').onchange=e=>{push();n.ty=e.target.value;save();render()};
 $('sz').onchange=e=>{push();n.r=+e.target.value;save();render()};
 $('sh').onchange=e=>{push();n.s=e.target.value;save();render()};$('im').onpointerdown=push;$('im').oninput=e=>{n.i=+e.target.value;$('iv').textContent=n.i;save();render()};
 $('ok').onchange=e=>{push();n.ok=e.target.checked;save();render()};
 side.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>{push();n.c=i.dataset.c;save();render();panel()});
 $('del').onclick=del;
 $('ch').onclick=()=>{push();const m=addNode(n.x+110,n.y+50);S.edges.push({id:uid(),a:n.id,b:m.id});setSel([m.id]);save();render();panel();$('t').focus();$('t').select()};
 $('du').onclick=dup;
 $('cp').onclick=()=>{try{navigator.clipboard.writeText(n.note)}catch(e){}};
}
function addNode(x,y){const n={id:uid(),x,y,t:T('new'),c:'#ffffff',note:''};S.nodes.push(n);return n}
function dup(){const ids0=[...M].filter(N);if(!ids0.length)return;push();const map={},ids=[];for(const id of ids0){const n=N(id),m={...n,id:uid(),x:n.x+50,y:n.y+50};map[id]=m.id;S.nodes.push(m);ids.push(m.id)}
 S.edges.filter(e=>map[e.a]&&map[e.b]).forEach(e=>S.edges.push({...e,id:uid(),a:map[e.a],b:map[e.b]}));save();setSel(ids)}
function del(){if(!sel)return;push();if(sel.t=='e')S.edges=S.edges.filter(e=>e.id!=sel.id);else{S.nodes=S.nodes.filter(n=>!M.has(n.id));S.edges=S.edges.filter(e=>!M.has(e.a)&&!M.has(e.b))}M=new Set();sel=null;save();render();panel()}
function connect(a,b){if(a==b||S.edges.some(e=>(e.a==a&&e.b==b)||(e.a==b&&e.b==a)))return;push();S.edges.push({id:uid(),a,b});save()}
function select(s){sel=s;M=new Set(s&&s.t=='n'?[s.id]:[]);render();panel()}
function setSel(ids){ids=ids.filter(N);M=new Set(ids);sel=ids.length==1?{t:'n',id:ids[0]}:ids.length>1?{t:'m'}:null;render();panel()}
function mpanel(){
 const ns=[...M].map(N).filter(Boolean),O=o=>Object.keys(o).map(k=>`<option value="${k}">${o[k]}</option>`).join('');
 side.innerHTML=`<div><b>${T('sel')}: ${ns.length}</b></div><div class="mu">${T('sethint')}</div>
 <div class="row"><select id="mty"><option value="-">${T('ty')}</option>${O(TN)}</select><select id="msh"><option value="-">${T('sh')}</option>${O(SH)}</select></div>
 <select id="msz"><option value="-">${T('sz')}</option><option value="20">${T('sm')}</option><option value="28">${T('md')}</option><option value="40">${T('lg')}</option></select>
 <div class="sw">${COL.map(c=>`<i data-c="${c}" style="background:${c};color:${c}"></i>`).join('')}</div>
 <label class="mu">${T('prioall')}: <b id="miv">—</b><input type="range" id="mim" min="1" max="100" value="50" style="width:100%"></label>
 <div class="row"><button id="mok">${T('mok')}</button><button id="mno">${T('mno')}</button></div>
 <div class="row"><button id="mhx">${T('ax')}</button><button id="mhy">${T('ay')}</button></div>
 <button id="mch">${T('chain')}</button>
 <div class="row"><button id="du">${T('du')}</button><button id="del">${T('del')}</button></div>`;
 const ap=f=>{push();ns.forEach(f);save();render()},avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 $('mty').onchange=e=>{if(e.target.value!='-')ap(n=>n.ty=e.target.value)};
 $('msh').onchange=e=>{if(e.target.value!='-')ap(n=>n.s=e.target.value)};
 $('msz').onchange=e=>{if(e.target.value!='-')ap(n=>n.r=+e.target.value)};
 side.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>ap(n=>n.c=i.dataset.c));
 $('mim').onpointerdown=push;$('mim').oninput=e=>{$('miv').textContent=e.target.value;ns.forEach(n=>n.i=+e.target.value);save();render()};
 $('mok').onclick=()=>ap(n=>n.ok=true);$('mno').onclick=()=>ap(n=>n.ok=false);
 $('mhx').onclick=()=>{const y=avg(ns.map(n=>n.y));ap(n=>n.y=y)};$('mhy').onclick=()=>{const x=avg(ns.map(n=>n.x));ap(n=>n.x=x)};
 $('mch').onclick=()=>{push();const o=[...ns].sort((a,b)=>a.x-b.x);for(let i=0;i<o.length-1;i++){const a=o[i].id,b=o[i+1].id;if(!S.edges.some(e=>(e.a==a&&e.b==b)||(e.a==b&&e.b==a)))S.edges.push({id:uid(),a,b})}save();render()};
 $('du').onclick=dup;$('del').onclick=del}
function fit(){if(!S.nodes.length)return;const r=svg.getBoundingClientRect(),xs=S.nodes.map(n=>n.x),ys=S.nodes.map(n=>n.y),x0=Math.min(...xs)-70,x1=Math.max(...xs)+70,y0=Math.min(...ys)-70,y1=Math.max(...ys)+70,k=Math.min(2,r.width/(x1-x0),r.height/(y1-y0));S.v={k,x:r.width/2-(x0+x1)/2*k,y:r.height/2-(y0+y1)/2*k};render();save()}

svg.addEventListener('pointerdown',e=>{
 const ne=e.target.closest('[data-n]'),ee=e.target.closest('[data-e]'),p=pt(e),cm=e.ctrlKey||e.metaKey;
 drag={moved:false,sx:e.clientX,sy:e.clientY,p0:p,cm};
 if(ne){const id=ne.dataset.n;drag.id=id;
  if(e.shiftKey&&!selMode){drag.mode='link';tmp={from:id,x:p.x,y:p.y}}
  else{drag.mode='node';if(!M.has(id)&&!cm)M=new Set([id]);drag.st=(M.has(id)?[...M]:[id]).map(i=>{const n=N(i);return[i,n.x,n.y]})}}
 else if(ee){drag.mode='edge';drag.id=ee.dataset.e}
 else if(selMode||e.shiftKey){drag.mode='box';box={x0:p.x,y0:p.y,x1:p.x,y1:p.y}}
 else{drag.mode='pan';drag.vx=S.v.x;drag.vy=S.v.y}
 svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!drag.moved&&Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>3){drag.moved=true;if(drag.mode=='node')push()}
 const p=pt(e);
 if(drag.mode=='node'&&drag.moved){const dx=p.x-drag.p0.x,dy=p.y-drag.p0.y,g=v=>S.cfg.snap?Math.round(v/24)*24:v;for(const[i,x,y]of drag.st){const n=N(i);n.x=g(x+dx);n.y=g(y+dy)}render()}
 else if(drag.mode=='link'){tmp.x=p.x;tmp.y=p.y;render()}
 else if(drag.mode=='box'){box.x1=p.x;box.y1=p.y;render()}
 else if(drag.mode=='pan'){S.v.x=drag.vx+e.clientX-drag.sx;S.v.y=drag.vy+e.clientY-drag.sy;render()}});
svg.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;
 if(d.mode=='link'){tmp=null;const t=document.elementFromPoint(e.clientX,e.clientY),ne=t&&t.closest&&t.closest('[data-n]');if(ne)connect(d.id,ne.dataset.n);render();return}
 if(d.mode=='box'){const x0=Math.min(box.x0,box.x1),x1=Math.max(box.x0,box.x1),y0=Math.min(box.y0,box.y1),y1=Math.max(box.y0,box.y1);box=null;
  const ids=S.nodes.filter(n=>n.x>=x0&&n.x<=x1&&n.y>=y0&&n.y<=y1).map(n=>n.id);setSel(d.cm?[...new Set([...M,...ids])]:ids);return}
 if(d.mode=='node'){
  if(!d.moved){if(linkMode){if(!linkFrom)linkFrom=d.id;else{connect(linkFrom,d.id);linkFrom=null}render();return}
   if(d.cm){const t=new Set(M);t.has(d.id)?t.delete(d.id):t.add(d.id);setSel([...t])}else setSel([d.id])}
  else{save();setSel([...M])}}
 else if(d.mode=='edge'&&!d.moved)select({t:'e',id:d.id});
 else if(d.mode=='pan'){if(!d.moved){linkFrom=null;select(null)}else save()}});
svg.addEventListener('dblclick',e=>{if(e.target.closest('[data-n]')||e.target.closest('[data-e]'))return;push();const p=pt(e),n=addNode(p.x,p.y);save();select({t:'n',id:n.id});$('t').focus();$('t').select()});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.min(3,Math.max(.2,S.v.k*(e.deltaY<0?1.1:.9))),f=k/S.v.k;S.v.x=mx-(mx-S.v.x)*f;S.v.y=my-(my-S.v.y)*f;S.v.k=k;render();save()},{passive:false});
document.addEventListener('keydown',e=>{
 const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),m=e.ctrlKey||e.metaKey;
 if(m&&e.key.toLowerCase()=='z'&&!typing){e.preventDefault();e.shiftKey?restore(redo,hist):restore(hist,redo)}
 else if(m&&e.key.toLowerCase()=='y'&&!typing){e.preventDefault();restore(redo,hist)}
 else if(m&&e.key.toLowerCase()=='d'&&!typing){e.preventDefault();dup()}
 else if((e.key=='Delete'||e.key=='Backspace')&&!typing)del();
 else if(m&&e.key.toLowerCase()=='a'&&!typing){e.preventDefault();setSel(S.nodes.map(n=>n.id))}
 else if(e.key=='Escape'){linkFrom=null;select(null)}});

$('add').onclick=()=>{push();const r=svg.getBoundingClientRect(),n=addNode((r.width/2-S.v.x)/S.v.k,(r.height/2-S.v.y)/S.v.k);save();select({t:'n',id:n.id})};
$('lnk').onclick=e=>{linkMode=!linkMode;linkFrom=null;e.target.classList.toggle('on',linkMode);render()};
$('selb').onclick=e=>{selMode=!selMode;e.target.classList.toggle('on',selMode)};
$('un').onclick=()=>restore(hist,redo);$('re').onclick=()=>restore(redo,hist);$('fit').onclick=fit;
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
$('exp').onclick=()=>dl(curName()+'.json',JSON.stringify(S,null,1),'application/json');
$('md').onclick=()=>{let s='# '+T('mdt')+'\n\n';for(const n of S.nodes)s+=`## ${n.ok?'[x]':'[ ]'} ${n.t}${n.ty?' ('+TN[n.ty]+')':''}\n${n.note?'```\n'+n.note+'\n```\n':''}\n`;s+='## '+T('links')+'\n';for(const e of S.edges){const a=N(e.a),b=N(e.b);if(a&&b)s+=`- ${a.t} → ${b.t}${e.l?' ('+e.l+')':''}\n`}dl(curName()+'.md',s,'text/markdown')};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.nodes&&d.edges)newP(f.name.replace(/\.json$/i,'')||T('imp'),{nodes:d.nodes,edges:d.edges,v:d.v||{x:0,y:0,k:1},cfg:{...DEF,...d.cfg}});else throw 0}catch(x){$('stat').textContent=T('err')}});e.target.value=''};
$('cfg').onclick=()=>$('set').classList.toggle('o');
$('clr').onclick=e=>two(e.target,T('sure'),()=>{push();S.nodes=[];S.edges=[];sel=null;M=new Set();save();render();panel()});
function sync(){$('fx').checked=S.cfg.fx;$('amp').value=S.cfg.amp;$('bolts').value=S.cfg.bolts;$('spd').value=S.cfg.spd;$('snap').checked=S.cfg.snap;$('lbl').checked=S.cfg.lbl}
[['fx','checked'],['bolts','value'],['amp','value'],['spd','value'],['snap','checked'],['lbl','checked']].forEach(([id,p])=>$(id).oninput=e=>{S.cfg[id]=p=='value'?+e.target.value:e.target.checked;save();render()});
const fresh=()=>({nodes:[],edges:[],v:{x:0,y:0,k:1},cfg:{...DEF}}),curName=()=>P.list.find(p=>p.id==P.cur).name.replace(/[^\w\u0400-\u04FF.-]+/g,'_');
const ld=id=>{let d=null;try{d=JSON.parse(localStorage.getItem(PD(id)))}catch(e){}return d||fresh()};
function pfill(){$('tabs').innerHTML=P.list.map(p=>`<div class="tab ${p.id==P.cur?'a':''}" data-p="${p.id}" title="${T('rn')}"><span>${esc(p.name)}</span>${P.list.length>1?`<b data-x="${p.id}" title="${T('cl')}">×</b>`:''}</div>`).join('')+'<button id="tn" title="'+T('np')+'">＋</button>'}
function closeP(id){if(id==P.cur)return delP();try{localStorage.removeItem(PD(id))}catch(e){}P.list=P.list.filter(p=>p.id!=id);pfill();save()}
function ren(id){const el=$('tabs').querySelector(`[data-p="${id}"] span`);if(!el)return;const p=P.list.find(x=>x.id==id),i=document.createElement('input');i.type='text';i.value=p.name;el.replaceWith(i);i.focus();i.select();let done=false;
 const fin=ok=>{if(done)return;done=true;const v=i.value.trim();if(ok&&v)p.name=v;pfill();save()};
 i.onkeydown=e=>{if(e.key=='Enter')fin(true);else if(e.key=='Escape')fin(false)};i.onblur=()=>fin(true);i.onclick=e=>e.stopPropagation()}
function reset(){sel=null;M=new Set();hist=[];redo=[];linkFrom=null;tmp=null;box=null;q='';$('q').value='';S.cfg={...DEF,...S.cfg};S.v=S.v||{x:0,y:0,k:1};sync();render();panel()}
function openP(id){save();P.cur=id;S=ld(id);pfill();reset();save()}
function newP(name,data){save();const id='p'+Math.random().toString(36).slice(2,8);P.list.push({id,name});P.cur=id;S=data||fresh();pfill();reset();save()}
function delP(){const i=P.list.findIndex(p=>p.id==P.cur);try{localStorage.removeItem(PD(P.cur))}catch(e){}P.list.splice(i,1);
 if(!P.list.length){P.list.push({id:'p'+Date.now().toString(36),name:T('proj')+' 1'});P.cur=P.list[0].id;S=fresh()}else{P.cur=P.list[Math.max(0,i-1)].id;S=ld(P.cur)}
 pfill();reset();save()}
function two(b,t,fn){if(b.dataset.arm){clearTimeout(+b.dataset.arm);b.textContent=b.dataset.o;delete b.dataset.arm;fn();return}b.dataset.o=b.textContent;b.textContent=t;b.dataset.arm=setTimeout(()=>{b.textContent=b.dataset.o;delete b.dataset.arm},3000)}
$('tabs').onclick=e=>{const x=e.target.closest('[data-x]');if(x){const id=x.dataset.x;two(x,'?',()=>closeP(id));return}
 if(e.target.closest('#tn')){newP(T('proj')+' '+(P.list.length+1));ren(P.cur);return}
 const t=e.target.closest('.tab');if(t&&!e.target.closest('input')&&t.dataset.p!=P.cur)openP(t.dataset.p)};
$('tabs').ondblclick=e=>{const t=e.target.closest('.tab');if(t&&!e.target.closest('input'))ren(t.dataset.p)};
function applyLang(){document.documentElement.lang=lang;document.title=T('title');Object.assign(TN,TNL[lang]);Object.assign(SH,SHL[lang]);
 ['add','lnk','selb','fit','imp','clr'].forEach(i=>$(i).textContent=T(i));$('q').placeholder=T('q');
 ['fx','amp','spd','bolts','snap','lbl'].forEach(i=>$(i).parentNode.firstChild.nodeValue=T(i));
 $('lang').textContent='🌐 '+lang.toUpperCase();pfill();sync();render();panel()}
$('lang').onclick=()=>{lang=lang=='ru'?'en':'ru';try{localStorage.setItem('pentest-lang',lang)}catch(e){}applyLang()};
applyLang();save();
</script></body></html>
